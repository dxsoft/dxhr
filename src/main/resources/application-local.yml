# Local MySQL development configuration
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=local

spring:
  application:
    name: rsgzgl
  datasource:
    url: jdbc:mysql://localhost:3306/gzjsgl?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${LOCAL_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

rsgzgl:
  security:
    initialize-schema: true
    admin:
      username: admin
      password: ${LOCAL_ADMIN_PASSWORD:admin123}
      display-name: 系统管理员

logging:
  level:
    com.dxsoft.rsgzgl: DEBUG
    org.springframework.jdbc: DEBUG
