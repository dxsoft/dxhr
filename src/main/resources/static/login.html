<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 人事工资管理系统</title>
    <link rel="stylesheet" href="/auth.css?v=20260701-login-layout">
</head>
<body class="login-page">
<div class="login-shell">
    <aside class="login-hero" aria-hidden="true">
        <div class="login-hero-inner">
            <div class="brand-line">
                <div class="brand-mark">薪</div>
                <div>
                    <strong>人事工资管理系统</strong>
                    <span>VFP 迁移版 · Spring Boot</span>
                </div>
            </div>
            <h2 class="login-hero-title">统一人事与工资业务入口</h2>
            <p class="login-hero-desc">支持人员维护、工资试算、推算对账、标准查询与权限管理，逐步替换原桌面系统。</p>
            <ul class="login-feature-list">
                <li><span class="login-feature-icon">人</span>人员、任职、学历与考核</li>
                <li><span class="login-feature-icon">薪</span>工资试算与历次调资对账</li>
                <li><span class="login-feature-icon">标</span>工资与津补贴标准查询</li>
                <li><span class="login-feature-icon">权</span>按单位范围的数据权限</li>
            </ul>
        </div>
    </aside>

    <main class="login-card">
        <div class="login-card-header">
            <h1>登录系统</h1>
            <p>使用管理员分配的账号密码进入工作台。</p>
        </div>
        <div id="message" class="message" role="status"></div>
        <form method="post" action="/login" class="login-form">
            <label>
                用户名
                <input name="username" autocomplete="username" placeholder="请输入用户名" required autofocus>
            </label>
            <label>
                密码
                <input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
            </label>
            <button type="submit">进入工作台</button>
        </form>
        <p class="login-footnote">登录后按角色权限显示菜单与单位数据范围。</p>
    </main>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const message = document.getElementById("message");
    if (params.has("error")) {
        message.className = "message error";
        message.textContent = "用户名或密码错误，请重试。";
    } else if (params.has("logout")) {
        message.className = "message success";
        message.textContent = "已安全退出，欢迎再次使用。";
    } else {
        message.className = "message hint";
        message.textContent = "请输入账号密码登录。";
    }
</script>
</body>
</html>
