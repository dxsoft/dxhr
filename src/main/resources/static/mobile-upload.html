<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>手机拍照上传</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #1677ff;
            --border: #d9d9d9;
            --text: #1f1f1f;
            --muted: #666;
            --error: #cf1322;
            --ok: #389e0d;
            --warn: #d48806;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: var(--text);
        }
        .page {
            max-width: 560px;
            margin: 0 auto;
            padding: 16px;
        }
        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 20px;
        }
        .hint, .notice {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }
        .notice {
            padding: 10px 12px;
            border-radius: 8px;
            background: #fffbe6;
            border: 1px solid #ffe58f;
            color: #874d00;
        }
        .notice.hidden { display: none; }
        .notice strong { color: #ad6800; }
        .stage {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bbb;
            font-size: 14px;
            text-align: center;
            padding: 16px;
        }
        .stage.hidden { display: none; }
        video, img.preview {
            width: 100%;
            max-height: 55vh;
            object-fit: contain;
            display: block;
        }
        img.preview.hidden, video.hidden, button.hidden { display: none; }
        .status {
            margin: 12px 0 0;
            min-height: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .status.error { color: var(--error); }
        .status.ok { color: var(--ok); }
        .status.warn { color: var(--warn); }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        button, .file-button {
            width: 100%;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 16px;
            text-align: center;
        }
        button.primary, .file-button.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        button:disabled, .file-button.disabled {
            opacity: 0.55;
            pointer-events: none;
        }
        .uploaded-list {
            margin: 16px 0 0;
            padding: 0;
            list-style: none;
        }
        .uploaded-list li {
            padding: 8px 0;
            border-top: 1px solid #f0f0f0;
            font-size: 14px;
        }
        canvas { display: none; }
    </style>
</head>
<body>
<noscript>
    <div class="page"><div class="card"><h1>手机拍照上传</h1><p class="hint">请启用 JavaScript，或复制电脑端显示的链接到系统浏览器中打开。</p></div></div>
</noscript>
<div class="page">
    <div class="card">
        <h1>手机拍照上传</h1>
        <p class="hint">拍照后会自动传回电脑端附件列表，可连续上传多张。</p>
        <div id="inapp-notice" class="notice hidden">
            <strong>当前为微信/内置浏览器，可能白屏。</strong>请点击右上角「···」，选择「在浏览器中打开」或「在 Safari/Chrome 中打开」后再拍照。
        </div>
        <div id="stage-placeholder" class="stage">正在验证上传链接...</div>
        <div id="camera-stage" class="stage hidden">
            <video id="camera-video" playsinline muted></video>
            <img id="camera-preview" class="preview hidden" alt="拍照预览">
        </div>
        <canvas id="camera-canvas"></canvas>
        <div id="status" class="status"></div>
        <div class="actions">
            <label id="capture-label" class="file-button primary">
                立即拍照上传
                <input id="capture-input" type="file" accept="image/*" capture="environment" hidden>
            </label>
            <label id="gallery-label" class="file-button">
                从相册选择
                <input id="gallery-input" type="file" accept="image/*" hidden>
            </label>
            <button id="open-browser-button" type="button" class="hidden">复制链接到浏览器打开</button>
            <button id="live-camera-button" type="button" class="hidden">使用实时摄像头</button>
            <button id="snap-button" type="button" class="primary hidden">拍照</button>
            <button id="retake-button" type="button" class="hidden">重拍</button>
            <button id="upload-button" type="button" class="primary hidden">确认上传</button>
        </div>
        <ul id="uploaded-list" class="uploaded-list"></ul>
    </div>
</div>
<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var token = (params.get("token") || "").trim();
        var userAgent = navigator.userAgent || "";
        var isInAppBrowser = /MicroMessenger|QQ\/|Weibo|DingTalk|AlipayClient|BytedanceWebview/i.test(userAgent);
        var apiBase = window.location.origin || "";
        var statusEl = document.getElementById("status");
        var stagePlaceholder = document.getElementById("stage-placeholder");
        var cameraStage = document.getElementById("camera-stage");
        var video = document.getElementById("camera-video");
        var preview = document.getElementById("camera-preview");
        var canvas = document.getElementById("camera-canvas");
        var captureLabel = document.getElementById("capture-label");
        var galleryLabel = document.getElementById("gallery-label");
        var captureInput = document.getElementById("capture-input");
        var galleryInput = document.getElementById("gallery-input");
        var openBrowserButton = document.getElementById("open-browser-button");
        var liveCameraButton = document.getElementById("live-camera-button");
        var snapButton = document.getElementById("snap-button");
        var retakeButton = document.getElementById("retake-button");
        var uploadButton = document.getElementById("upload-button");
        var uploadedList = document.getElementById("uploaded-list");
        var stream = null;
        var captureBlob = null;
        var sessionReady = false;
        var uploading = false;

        if (isInAppBrowser) {
            document.getElementById("inapp-notice").classList.remove("hidden");
            openBrowserButton.classList.remove("hidden");
        }

        function setStatus(message, type) {
            statusEl.textContent = message || "";
            statusEl.className = "status" + (type ? " " + type : "");
        }

        function readApiError(data, fallback) {
            if (!data) {
                return fallback;
            }
            return data.message || data.detail || data.title || fallback;
        }

        function setUploadEnabled(enabled) {
            captureLabel.classList.toggle("disabled", !enabled);
            galleryLabel.classList.toggle("disabled", !enabled);
            captureInput.disabled = !enabled;
            galleryInput.disabled = !enabled;
        }

        function stopStream() {
            if (stream) {
                stream.getTracks().forEach(function (track) { track.stop(); });
                stream = null;
            }
            video.srcObject = null;
        }

        function fetchWithTimeout(url, options, timeoutMs) {
            return new Promise(function (resolve, reject) {
                var timer = window.setTimeout(function () {
                    reject(new Error("连接超时，请确认手机与电脑在同一 Wi-Fi，并使用局域网 IP 访问。"));
                }, timeoutMs || 15000);
                fetch(url, options).then(function (response) {
                    window.clearTimeout(timer);
                    resolve(response);
                }).catch(function (error) {
                    window.clearTimeout(timer);
                    reject(error);
                });
            });
        }

        function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return Promise.reject(new Error("当前浏览器不支持实时摄像头，请使用“立即拍照上传”。"));
            }
            stopStream();
            return navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: false
            }).then(function (mediaStream) {
                stream = mediaStream;
                stagePlaceholder.classList.add("hidden");
                cameraStage.classList.remove("hidden");
                video.classList.remove("hidden");
                preview.classList.add("hidden");
                video.srcObject = stream;
                return video.play().catch(function () {});
            });
        }

        function resetPreview() {
            captureBlob = null;
            preview.classList.add("hidden");
            preview.removeAttribute("src");
            video.classList.remove("hidden");
            snapButton.classList.add("hidden");
            retakeButton.classList.add("hidden");
            uploadButton.classList.add("hidden");
            liveCameraButton.classList.remove("hidden");
        }

        function formatFileName() {
            var stamp = new Date();
            function pad(value) { return String(value).padStart(2, "0"); }
            return "手机拍照-" + stamp.getFullYear() + pad(stamp.getMonth() + 1) + pad(stamp.getDate()) + "-"
                + pad(stamp.getHours()) + pad(stamp.getMinutes()) + pad(stamp.getSeconds()) + ".jpg";
        }

        function capturePhoto() {
            var width = video.videoWidth || 1280;
            var height = video.videoHeight || 720;
            canvas.width = width;
            canvas.height = height;
            canvas.getContext("2d").drawImage(video, 0, 0, width, height);
            canvas.toBlob(function (blob) {
                if (!blob) {
                    setStatus("拍照失败，请重试。", "error");
                    return;
                }
                captureBlob = blob;
                preview.src = canvas.toDataURL("image/jpeg", 0.92);
                video.classList.add("hidden");
                preview.classList.remove("hidden");
                snapButton.classList.add("hidden");
                retakeButton.classList.remove("hidden");
                uploadButton.classList.remove("hidden");
                setStatus("请确认照片后上传。");
            }, "image/jpeg", 0.92);
        }

        function uploadBlob(blob, fileName) {
            var form = new FormData();
            form.append("file", new File([blob], fileName, { type: blob.type || "image/jpeg" }));
            return fetchWithTimeout(apiBase + "/api/mobile-attachment-sessions/" + encodeURIComponent(token) + "/files", {
                method: "POST",
                body: form
            }, 60000).then(function (response) {
                return response.json().catch(function () { return {}; }).then(function (data) {
                    if (!response.ok) {
                        throw new Error(readApiError(data, "上传失败"));
                    }
                    return data;
                });
            });
        }

        function appendUploadedItem(name) {
            var item = document.createElement("li");
            item.textContent = "已上传：" + name;
            uploadedList.insertBefore(item, uploadedList.firstChild);
        }

        function uploadFile(file) {
            if (!file || uploading) {
                return;
            }
            if (!sessionReady) {
                setStatus("上传链接尚未就绪，请稍后重试。", "error");
                return;
            }
            uploading = true;
            setUploadEnabled(false);
            setStatus("正在上传...");
            uploadBlob(file, file.name || formatFileName()).then(function () {
                appendUploadedItem(file.name || formatFileName());
                setStatus("上传成功，可继续拍照。", "ok");
            }).catch(function (error) {
                setStatus(error.message || "上传失败", "error");
            }).finally(function () {
                uploading = false;
                setUploadEnabled(true);
                captureInput.value = "";
                galleryInput.value = "";
            });
        }

        function uploadCurrentPhoto() {
            if (!captureBlob || uploading) {
                setStatus("请先拍照。", "error");
                return;
            }
            uploading = true;
            uploadButton.disabled = true;
            setStatus("正在上传...");
            var fileName = formatFileName();
            uploadBlob(captureBlob, fileName).then(function () {
                appendUploadedItem(fileName);
                setStatus("上传成功，可继续拍照。", "ok");
                resetPreview();
                return startCamera();
            }).catch(function (error) {
                setStatus(error.message || "上传失败", "error");
            }).finally(function () {
                uploading = false;
                uploadButton.disabled = false;
            });
        }

        function validateSession() {
            if (!token) {
                return Promise.reject(new Error("上传链接无效，请在电脑端重新生成二维码。"));
            }
            return fetchWithTimeout(apiBase + "/api/mobile-attachment-sessions/" + encodeURIComponent(token), {}, 15000)
                .then(function (response) {
                    return response.json().catch(function () { return {}; }).then(function (data) {
                        if (!response.ok) {
                            throw new Error(readApiError(data, "上传会话无效或已过期，请在电脑端关闭弹窗后重新打开「手机拍照」。"));
                        }
                        sessionReady = true;
                    });
                });
        }

        function bootstrap() {
            setUploadEnabled(false);
            stagePlaceholder.textContent = "正在验证上传链接...";
            validateSession().then(function () {
                stagePlaceholder.textContent = "点击下方按钮拍照上传。";
                setStatus("链接有效，可直接拍照上传。", "ok");
                setUploadEnabled(true);
                if (!isInAppBrowser && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    liveCameraButton.classList.remove("hidden");
                }
            }).catch(function (error) {
                stagePlaceholder.textContent = error.message || "无法使用手机拍照。";
                setStatus(error.message || "无法使用手机拍照。", "error");
                setUploadEnabled(false);
            });
        }

        captureInput.addEventListener("change", function () {
            uploadFile(captureInput.files && captureInput.files[0]);
        });
        galleryInput.addEventListener("change", function () {
            uploadFile(galleryInput.files && galleryInput.files[0]);
        });
        openBrowserButton.addEventListener("click", function () {
            var currentUrl = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentUrl).then(function () {
                    setStatus("链接已复制，请到 Safari/Chrome 粘贴打开。", "ok");
                }).catch(function () {
                    window.prompt("复制此链接到系统浏览器打开：", currentUrl);
                });
            } else {
                window.prompt("复制此链接到系统浏览器打开：", currentUrl);
            }
        });
        liveCameraButton.addEventListener("click", function () {
            liveCameraButton.classList.add("hidden");
            snapButton.classList.remove("hidden");
            setStatus("正在启动摄像头...");
            startCamera().then(function () {
                setStatus("摄像头已就绪。");
            }).catch(function (error) {
                liveCameraButton.classList.remove("hidden");
                snapButton.classList.add("hidden");
                setStatus(error.message || "无法启动摄像头。", "error");
            });
        });
        snapButton.addEventListener("click", capturePhoto);
        retakeButton.addEventListener("click", function () {
            resetPreview();
            setStatus("摄像头已就绪。");
            startCamera().catch(function (error) {
                setStatus(error.message || "无法启动摄像头。", "error");
            });
        });
        uploadButton.addEventListener("click", uploadCurrentPhoto);
        window.addEventListener("pagehide", stopStream);
        bootstrap();
    })();
</script>
</body>
</html>
