spring:
  application:
    name: rsgzgl
  datasource:
    url: ${RSGZGL_DB_URL:jdbc:mysql://localhost:3306/gzjsgl?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${RSGZGL_DB_USERNAME:root}
    password: ${RSGZGL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

rsgzgl:
  security:
    initialize-schema: ${RSGZGL_SECURITY_INITIALIZE_SCHEMA:true}
    admin:
      username: ${RSGZGL_ADMIN_USERNAME:admin}
      password: ${RSGZGL_ADMIN_PASSWORD:}
      display-name: ${RSGZGL_ADMIN_DISPLAY_NAME:系统管理员}
