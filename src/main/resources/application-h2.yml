spring:
  application:
    name: rsgzgl
  datasource:
    url: jdbc:h2:mem:gzjsgl;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

rsgzgl:
  security:
    initialize-schema: true
    admin:
      username: admin
      password: admin123
      reset-password: true
      display-name: 系统管理员
